# Runs automatically whenever you push changes (like a new episode) to GitHub.
# It builds the podcast feed and publishes it with GitHub Pages.
name: Publish podcast feed

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, so each episode keeps the date it was added
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mutagen
      - uses: actions/configure-pages@v5
      - run: python generate_feed.py --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
